<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- daisy ui cdn -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind cdn -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <!-- font awesome cdn -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-[#f4f5f7] h-[200vh]">
    <!-- <h1>This is home page</h1> -->

<div class="max-w-lg mx-auto bg-white rounded-b-xl">
        <div class="min-h-[50px] flex justify-between items-center max-w-lg mx-auto border-b-1 border-gray-200 p-3">
        <div class="flex">
              <img src="./assets/Group.png" class="h-[50px]" alt="">
              <div class="ml-3">
                <h2 class="font-bold">$<span>45000</span></h2>
              <p class="text-[#08080880]">Available Balance</p>  
              </div>
        </div>


        <div>
          <button class="btn text-[#08080880]"><i class="fa-solid fa-arrow-right-from-bracket rotate-180 text-gray-500 "></i> Log Out</button>
        </div>
    </div>

    <div class="mt-8 p-3">
        <h1 class="text-2xl font-bold">🔥 Welcome to Payooo!</h1>
        <p class="text-[#08080880] mt-4">Enjoy easy and convenient financial services with us. Cashout charge is low and easy.</p>
    </div>

    <div class=" min-h-[200px] grid grid-cols-3 mt-4 gap-4 p-3">
        <div class="border-2 border-gray-300 text-center p-3 rounded-xl ">
            <img src="./assets/wallet1.png" class="mx-auto" alt="">
            <h2>Add Money</h2>

        </div>
        <div class="border-2  border-gray-300 text-center p-3 rounded-xl">
            <img src="./assets/send1.png" class="mx-auto" alt="">
            <h2>Cashout</h2>

        </div>
        <div class="border-2  border-gray-300 text-center p-3 rounded-xl">
            <img src="./assets/money1.png" class="mx-auto" alt="">
            <h2>Send Money</h2>

        </div>
        <div class="border-2  border-gray-300 text-center p-3 rounded-xl">
            <img src="./assets/bonus1.png" class="mx-auto" alt="">
            <h2>Get Bonus</h2>

        </div>
        <div class="border-2  border-gray-300 text-center p-3 rounded-xl">
            <img src="./assets/purse1.png" class="mx-auto" alt="">
            <h2>Pay Bill</h2>

        </div>
        <div class="border-2  border-gray-300 text-center p-3 rounded-xl">
            <img src="./assets/transaction1.png" class="mx-auto" alt="">
            <h2>Transactions</h2>

        </div>

    </div>
</div>


<!-- form -->
 <div class="all-form-sections max-w-lg mx-auto">
    <!-- add money -->
   <div>
    <h1 class="font-bold text-2xl p-3 ml-1">Add Money</h1>
    <form action="" class="bg-white rounded-2xl p-8 mt-3">
        <div>
            <h1 class=" font-semibold">Select A Bank</h1>
            <select class="select select-ghostbg-[#f4f5f7] mt-3 rounded-3xl w-full bg-[#f4f5f7] ">
  <option disabled selected >Select a Bank</option>
  <option>Islami Bank</option>
  <option>Dutch Bangla</option>
  <option>IFIC</option>
  <option>UCB</option>
  <option>Asia Bank</option>
</select>
        </div>
        <br>
        <div>
            
            <label class="font-semibold" for="">Bank Account Number</label>
            
            <input type="text " placeholder="Enter 11 digit account number" class="input bg-[#f4f5f7] mt-3 rounded-3xl w-full">
        </div>
        <br>
        <div>
            <label class="font-semibold" for="">Amount to add Money</label>
            <!-- <br> -->
            <input type="text " placeholder="Add amount to withdraw" class="input bg-[#f4f5f7] mt-3 rounded-3xl w-full">
           
        </div>
        <br>
        <div>
            <label class="font-semibold" for="">Pin Number</label>
            <br>
            <input type="text " placeholder="Enter 4 digit pin number" class="input bg-[#f4f5f7] mt-3 rounded-3xl w-full">
            
           
        </div>

            <button type="button" class="btn bg-[#0874F2] mt-5 w-full rounded-3xl text-white">Add Money</button>
    </form>
   </div>
 </div>
</body>
</html>
